<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -50 400 200" width="1024" height="512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="llmBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
  </defs>
  <rect x="-150" y="-50" width="400" height="200" fill="#ffffff" />
  <g filter="url(#shadow)">
    <!-- Overlapping Doc pages representing parameters -->
    <rect x="25" y="20" width="46" height="56" rx="6" fill="#FFF" stroke="url(#llmBlue)" stroke-width="4" />
    <rect x="33" y="28" width="46" height="56" rx="6" fill="#FFF" stroke="url(#llmBlue)" stroke-width="4" />
    <!-- Tech text lines inside the top doc -->
    <line x1="43" y1="40" x2="65" y2="40" stroke="url(#llmBlue)" stroke-width="4.5" stroke-linecap="round" />
    <line x1="43" y1="52" x2="60" y2="52" stroke="url(#llmBlue)" stroke-width="4.5" stroke-linecap="round" />
    <line x1="43" y1="64" x2="52" y2="64" stroke="url(#llmBlue)" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>