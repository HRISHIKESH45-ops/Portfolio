<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -50 400 200" width="1024" height="512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="jupOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E0F" />
      <stop offset="100%" stop-color="#D95000" />
    </linearGradient>
  </defs>
  <rect x="-150" y="-50" width="400" height="200" fill="#ffffff" />
  <g filter="url(#shadow)">
    <!-- Concentric planetary ring representing Jupyter -->
    <ellipse cx="50" cy="50" rx="36" ry="14" fill="none" stroke="url(#jupOrange)" stroke-width="8" />
    <!-- Core planetary bodies -->
    <circle cx="50" cy="50" r="16" fill="#FFF" stroke="url(#jupOrange)" stroke-width="4" />
    <circle cx="50" cy="36" r="5" fill="url(#jupOrange)" />
    <circle cx="50" cy="64" r="5" fill="url(#jupOrange)" />
  </g>
</svg>