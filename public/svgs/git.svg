<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -50 400 200" width="1024" height="512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="gitOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F05032" />
      <stop offset="100%" stop-color="#F15E42" />
    </linearGradient>
  </defs>
  <rect x="-150" y="-50" width="400" height="200" fill="#ffffff" />
  <g filter="url(#shadow)">
    <!-- Rounded Diamond Base -->
    <rect x="20" y="20" width="60" height="60" rx="10" transform="rotate(45 50 50)" fill="url(#gitOrange)" />
    <!-- Branch Lines -->
    <line x1="40" y1="35" x2="40" y2="65" stroke="#FFF" stroke-width="4.5" />
    <path d="M40,50 Q56,50 56,38" fill="none" stroke="#FFF" stroke-width="4.5" />
    <!-- Branch Node circles -->
    <circle cx="40" cy="35" r="5" fill="#FFF" />
    <circle cx="40" cy="65" r="5" fill="#FFF" />
    <circle cx="56" cy="35" r="5" fill="#FFF" />
  </g>
</svg>