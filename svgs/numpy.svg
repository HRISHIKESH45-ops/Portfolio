<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -50 400 200" width="1024" height="512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="blueSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#014B7C" />
      <stop offset="100%" stop-color="#002F55" />
    </linearGradient>
    <linearGradient id="cyanTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E9CD3" />
      <stop offset="100%" stop-color="#1B6097" />
    </linearGradient>
  </defs>
  <rect x="-150" y="-50" width="400" height="200" fill="#ffffff" />
  <g filter="url(#shadow)">
    <!-- Left Isometric Faces -->
    <path d="M50,15 L18,33 L18,65 L50,47 Z" fill="url(#blueSide)" />
    <path d="M82,33 L50,51 L50,83 L82,65 Z" fill="url(#blueSide)" opacity="0.8" />
    <!-- Top Isometric Faces -->
    <path d="M50,15 L82,33 L50,51 L18,33 Z" fill="url(#cyanTop)" />
    <!-- Highlight Overlay grid line -->
    <path d="M50,47 L50,83" stroke="#FFF" stroke-width="2" opacity="0.3" />
  </g>
</svg>