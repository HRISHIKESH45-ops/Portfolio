<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -50 400 200" width="1024" height="512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#113075" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#113075" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  <rect x="-150" y="-50" width="400" height="200" fill="#ffffff" />
  <g filter="url(#shadow)">
    <!-- Grid lines -->
    <line x1="20" y1="25" x2="80" y2="25" stroke="#E1E6EB" stroke-width="2" />
    <line x1="20" y1="50" x2="80" y2="50" stroke="#E1E6EB" stroke-width="2" />
    <line x1="20" y1="75" x2="80" y2="75" stroke="#E1E6EB" stroke-width="2" />
    <!-- Area Chart Gradient Fill -->
    <path d="M20,75 L20,40 Q35,20 50,55 T80,30 L80,75 Z" fill="url(#chartGrad)" />
    <!-- Data Line -->
    <path d="M20,40 Q35,20 50,55 T80,30" fill="none" stroke="#113075" stroke-width="4" stroke-linecap="round" />
    <!-- Data Node Dots -->
    <circle cx="20" cy="40" r="4.5" fill="#113075" />
    <circle cx="50" cy="55" r="4.5" fill="#113075" />
    <circle cx="80" cy="30" r="4.5" fill="#113075" />
  </g>
</svg>