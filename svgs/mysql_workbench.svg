<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -50 400 200" width="1024" height="512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="wbTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008CA8" />
      <stop offset="100%" stop-color="#005A6F" />
    </linearGradient>
  </defs>
  <rect x="-150" y="-50" width="400" height="200" fill="#ffffff" />
  <g filter="url(#shadow)">
    <!-- Flat Platform Base -->
    <rect x="20" y="58" width="60" height="15" rx="4" fill="url(#wbTeal)" />
    <!-- Workbench tool vector (Wrench outline) -->
    <path d="M43,24 L43,58" stroke="#F29111" stroke-width="8" stroke-linecap="round" />
    <circle cx="43" cy="24" r="10" fill="none" stroke="#F29111" stroke-width="6" />
    <rect x="40" y="16" width="6" height="8" fill="#FFF" />
  </g>
</svg>