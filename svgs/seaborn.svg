<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -50 400 200" width="1024" height="512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b59b6" />
      <stop offset="100%" stop-color="#8e44ad" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3498db" />
      <stop offset="100%" stop-color="#2bc0e4" />
    </linearGradient>
  </defs>
  <rect x="-150" y="-50" width="400" height="200" fill="#ffffff" />
  <g filter="url(#shadow)">
    <!-- Density Wave 1 -->
    <path d="M15,80 Q35,20 55,60 T95,40" fill="none" stroke="url(#purpleGrad)" stroke-width="7" stroke-linecap="round" opacity="0.9" />
    <!-- Density Wave 2 (Offset) -->
    <path d="M15,70 Q40,35 60,75 T95,30" fill="none" stroke="url(#tealGrad)" stroke-width="5" stroke-linecap="round" opacity="0.75" />
  </g>
</svg>