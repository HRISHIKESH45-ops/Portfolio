<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -50 400 200" width="1024" height="512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2af598" />
      <stop offset="100%" stop-color="#009efd" />
    </linearGradient>
  </defs>
  <rect x="-150" y="-50" width="400" height="200" fill="#ffffff" />
  <g filter="url(#shadow)">
    <!-- Science Flask -->
    <path d="M43,20 L57,20 L57,38 L78,74 C82,80 77,88 69,88 L31,88 C23,88 18,80 22,74 L43,38 Z" fill="none" stroke="url(#flaskGrad)" stroke-width="6" stroke-linejoin="round" />
    <!-- Liquid / Bubble points inside -->
    <path d="M31,74 C34,70 66,70 69,74 L69,83 L31,83 Z" fill="url(#flaskGrad)" opacity="0.8" />
    <circle cx="42" cy="55" r="3" fill="url(#flaskGrad)" />
    <circle cx="58" cy="62" r="4.5" fill="url(#flaskGrad)" />
    <circle cx="50" cy="45" r="2.5" fill="url(#flaskGrad)" />
  </g>
</svg>