<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -50 400 200" width="1024" height="512">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C811" />
      <stop offset="100%" stop-color="#D49E00" />
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066" />
      <stop offset="100%" stop-color="#F2C811" />
    </linearGradient>
  </defs>
  <rect x="-150" y="-50" width="400" height="200" fill="#ffffff" />
  <g filter="url(#shadow)">
    <!-- Column 1 (Left) -->
    <rect x="22" y="55" width="14" height="25" rx="4" fill="url(#gold1)" />
    <!-- Column 2 (Middle) -->
    <rect x="43" y="35" width="14" height="45" rx="4" fill="url(#gold1)" opacity="0.9" />
    <!-- Column 3 (Right) -->
    <rect x="64" y="15" width="14" height="65" rx="4" fill="url(#gold2)" />
  </g>
</svg>